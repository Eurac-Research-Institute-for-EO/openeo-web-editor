name: Build and publish Web Editor image

on:
  push:
    branches:
      - eurac-main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openeo-web-editor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Build one image per environment from the same commit; the only difference
    # is the backend the editor is compiled to talk to (config.js serverUrl).
    strategy:
      matrix:
        include:
          - server_url: https://openeo.eurac.edu/
            tags: |
              type=sha,prefix=
              type=raw,value=latest
              type=raw,value=eurac-main
              type=raw,value=stable
          - server_url: https://dev.openeo.eurac.edu/
            tags: |
              type=raw,value=dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ matrix.tags }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            OPENEO_SERVER_URL=${{ matrix.server_url }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
