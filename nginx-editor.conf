server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Editor is built with publicPath=/editor/ and served from there.
    # Use a prefix location (not an exact-match redirect) so the bare /editor
    # path is served directly WITH its query string intact — the OIDC popup
    # callback returns to /editor?code=...&state=... (the js-client strips the
    # trailing slash from the redirect_uri), and a 302 here would drop those
    # params and break login (redirect loop).
    location /editor {
        try_files $uri $uri/ /editor/index.html;
    }

    # Convenience: bare / redirects to the app.
    location = / {
        return 302 /editor/;
    }
}
