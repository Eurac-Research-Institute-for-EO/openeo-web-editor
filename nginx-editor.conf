server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a TLS-terminating ingress nginx sees http and would emit absolute
    # http:// redirects (insecure context breaks the OIDC popup). Keep redirects
    # relative so the browser preserves the https scheme.
    absolute_redirect off;

    # Serve bare /editor DIRECTLY as the SPA (no redirect). The OIDC popup
    # callback returns to /editor?code=...&state=... (the js-client strips the
    # trailing slash from redirect_uri), so this URL must serve the app with its
    # query intact AND match the redirect_uri exactly. A redirect here would
    # drop the params / downgrade the scheme and cause a login loop.
    location = /editor {
        try_files /editor/index.html =404;
    }

    # Assets and deep links under /editor/.
    location /editor/ {
        try_files $uri $uri/ /editor/index.html;
    }

    # Convenience: bare / goes to the app.
    location = / {
        return 302 /editor/;
    }
}
