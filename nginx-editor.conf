server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Editor is built with publicPath=/editor/ and served from there.
    location /editor/ {
        try_files $uri $uri/ /editor/index.html;
    }

    # Convenience: bare / and /editor redirect to the app root.
    location = / {
        return 302 /editor/;
    }
    location = /editor {
        return 302 /editor/;
    }
}
